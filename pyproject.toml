[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-ueba-anomaly-detector"
version = "1.0.0"
description = "Unsupervised Enterprise Telemetry & Identity Anomaly Detection Engine via Dual-Ensemble Isolation Forest and PCA Reconstruction"
authors = [{ name = "Md Habibur Rahaman Rana", email = "hrana36@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
